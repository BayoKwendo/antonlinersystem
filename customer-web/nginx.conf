# =============================================================================
#  customer-web nginx: serves the SPA (PWA) and reverse-proxies the API + the
#  tracking WebSocket to the `backend` service. Single origin → no CORS.
# =============================================================================
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml font/woff2 application/manifest+json;

    # Hashed, immutable build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache the entrypoint or the PWA control files (they must update).
    location = /index.html { add_header Cache-Control "no-store" always; }
    location = /sw.js { add_header Cache-Control "no-store" always; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache" always; }

    # REST API → Deno backend (keeps the full /api/v1/... URI).
    location /api/ {
        proxy_pass http://backend:5002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Live-tracking WebSocket (GET /ws) → backend, with upgrade headers.
    location /ws {
        proxy_pass http://backend:5002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback (client-side routing) + security headers.
    # CSP is tuned to the app's external hosts: OpenStreetMap tiles (map) and
    # Nominatim (location search). Same-origin /api + /ws are covered by 'self'.
    # Verify on first deploy if the map/geocoder change hosts.
    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self' wss: https://nominatim.openstreetmap.org; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }
}
