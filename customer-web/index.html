<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand-icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1656c7" />
    <!-- Apply the saved light/dark choice before first paint (no flash). No
         stored value → tokens.css follows the OS via prefers-color-scheme. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("sd-theme");
          if (t === "light" || t === "dark")
            document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <title>SMART Drill — Your One-Stop Shop for Borehole Services</title>
    <meta
      name="description"
      content="From survey to drilling, testing, equipping and maintenance, SMART Drill connects you with qualified borehole professionals across Kenya."
    />
    <meta property="og:title" content="SMART Drill — Borehole Services" />
    <meta property="og:description" content="Your one-stop shop for borehole services across Kenya." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SMART Drill" />
    <meta property="og:image" content="/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SMART Drill — Borehole Services" />
    <meta name="twitter:description" content="Your one-stop shop for borehole services across Kenya." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
