# =============================================================================
#  AntonLiner deployment stack — Deno API + Vite/nginx portal.
#  MySQL is EXTERNAL (installed on the server / managed) — NOT containerised here.
#  Point the backend at it via DB_HOST/DB_PORT below.
#
#    docker compose --env-file waterdril_back/.env up -d --build
#
#  The portal's nginx serves the SPA and reverse-proxies /api + /ws to the
#  backend (same origin → no CORS).
# =============================================================================
services:
  backend:
    build: ./waterdril_back
    restart: unless-stopped
    env_file: ./waterdril_back/.env          # DB_USER/DB_PASSWORD/DB_NAME, JWT, M-Pesa, SMS, AWS…
    environment:
      PORT: "5002"
      # --- External MySQL --------------------------------------------------
      # MySQL on THIS server's host  → keep host.docker.internal (see extra_hosts).
      # MySQL on a SEPARATE host/RDS → put its hostname/IP here, and remove extra_hosts.
      DB_HOST: host.docker.internal
      DB_PORT: "3306"
      # FCM key mounted read-only below (overrides the .env path).
      FCM_SERVICE_ACCOUNT_FILE: /app/secrets/waterdril-firebase-adminsdk.json
    extra_hosts:
      - "host.docker.internal:host-gateway"  # lets the container reach host MySQL on Linux
    volumes:
      - ./waterdril_back/secrets:/app/secrets:ro
    # Expose only for direct debugging; the portal proxies /api + /ws otherwise.
    # ports: ["5002:5002"]

  portal:
    build:
      context: ./portal
      args:
        # Served same-origin as its /api + /ws proxy (nginx), so the default is
        # RELATIVE and works on any host with no rebuild. Override with an absolute
        # URL only for a cross-origin API.
        #   default (any host):  /api/v1
        #   cross-origin:        https://your-domain/api/v1
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    restart: unless-stopped
    ports:
      - "${PORTAL_PORT:-8080}:80"
    depends_on:
      - backend
