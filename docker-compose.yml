# =============================================================================
#  AntonLiner deployment stack — Deno API + Vite/nginx portal.
#  MySQL is EXTERNAL (installed on the server host) — NOT containerised here.
#
#    docker compose --env-file waterdril_back/.env up -d --build
#
#  The backend runs on the HOST network so it reaches the host's MySQL on
#  127.0.0.1 directly (no bind-address change, no bridge grant). It also binds
#  :5002 on the host, which Apache's api. vhost proxies to. The portal container
#  reaches that backend via the 'backend' host alias (extra_hosts below).
# =============================================================================
services:
  backend:
    build: ./waterdril_back
    restart: unless-stopped
    # Share the host's network stack: 127.0.0.1 inside the container == the host's
    # loopback, so MySQL on 127.0.0.1:3306 (waterdril@127.0.0.1) just works. This
    # also publishes :5002 on the host — no `ports:` / `extra_hosts` needed.
    network_mode: host
    env_file: ./waterdril_back/.env          # DB_USER/DB_PASSWORD/DB_NAME, JWT, M-Pesa, SMS, AWS…
    environment:
      PORT: "5002"
      DB_HOST: 127.0.0.1                      # host MySQL over loopback
      DB_PORT: "3306"
      # FCM key mounted read-only below (overrides the .env path).
      FCM_SERVICE_ACCOUNT_FILE: /app/secrets/waterdril-firebase-adminsdk.json
    volumes:
      - ./waterdril_back/secrets:/app/secrets:ro

  portal:
    build:
      context: ./portal
      args:
        # Served same-origin as its /api + /ws proxy (nginx), so the default is
        # RELATIVE and works on any host with no rebuild. Override with an absolute
        # URL only for a cross-origin API.
        #   default (any host):  /api/v1
        #   cross-origin:        https://your-domain/api/v1
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    restart: unless-stopped
    ports:
      - "${PORTAL_PORT:-8080}:80"
    # The backend runs on the HOST network (not this bridge), so nginx's
    # `proxy_pass http://backend:5002` can't use Docker DNS. Point the 'backend'
    # hostname at the host gateway, where the backend's :5002 is listening.
    extra_hosts:
      - "backend:host-gateway"
    depends_on:
      - backend

  customer-web:
    build:
      context: ./customer-web
      args:
        # Same-origin /api + /ws proxy → relative default works on any host.
        VITE_API_URL: ${CUSTOMER_API_URL:-/api/v1}
    restart: unless-stopped
    ports:
      - "${CUSTOMER_PORT:-8096}:80"
    extra_hosts:
      - "backend:host-gateway"
    depends_on:
      - backend
