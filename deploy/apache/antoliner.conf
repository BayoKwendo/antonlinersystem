# AntonLiner — Apache2 reverse-proxy vhost (Ubuntu 24.04 / Apache 2.4)
#
#   /       -> portal SPA (static, built from portal/dist)
#   /api/   -> Deno backend on 127.0.0.1:5002 (v1 router, prefix /api/v1)
#   /ws     -> WebSocket (live tracking) on ws://127.0.0.1:5002/ws
#
# This is the plain :80 vhost. Run certbot (see README) to add the :443
# vhost + HTTP->HTTPS redirect automatically.
#
# Required modules: proxy proxy_http proxy_wstunnel headers rewrite

<VirtualHost *:80>
    ServerName SERVER_NAME_PLACEHOLDER
    DocumentRoot /var/www/antoliner

    RewriteEngine On

    # --- WebSocket upgrade (live tracking at GET /ws) MUST match first ---
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/ws(.*)$ ws://127.0.0.1:5002/ws$1 [P,L]

    # --- REST API -> Deno backend ---
    ProxyPreserveHost On
    ProxyPass        /api/  http://127.0.0.1:5002/api/
    ProxyPassReverse /api/  http://127.0.0.1:5002/api/
    RequestHeader set X-Forwarded-Proto "http"

    # --- Vite SPA: serve static assets, fall back to index.html ---
    <Directory /var/www/antoliner>
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    # Never let the SPA index.html fallback swallow API/asset misses
    <Location /api>
        FallbackResource disabled
    </Location>

    ErrorLog  ${APACHE_LOG_DIR}/antoliner_error.log
    CustomLog ${APACHE_LOG_DIR}/antoliner_access.log combined
</VirtualHost>
